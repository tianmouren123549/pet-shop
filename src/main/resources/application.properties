spring.application.name=petshop

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/pet_shop?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:trq123549}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true

# JSON
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=32MB

server.tomcat.max-http-form-post-size=32MB
server.tomcat.max-swallow-size=32MB
app.upload.dir=uploads


app.jwt.secret=${JWT_SECRET:petshop-dev-jwt-secret-change-me-min-32-bytes!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
