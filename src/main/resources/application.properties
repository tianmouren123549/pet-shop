server.port=8080

# -----------------------------------------------------------------------------
# MySQL??????? DB_USERNAME / DB_PASSWORD ???
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/pet_shop?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:trq123549}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# MyBatis-Plus / Jackson
# -----------------------------------------------------------------------------
mybatis-plus.configuration.map-underscore-to-camel-case=true
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# -----------------------------------------------------------------------------
# ?????????????
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=32MB
server.tomcat.max-http-form-post-size=32MB
server.tomcat.max-swallow-size=32MB
app.upload.dir=uploads

# -----------------------------------------------------------------------------
# JWT????????? JWT_SECRET ???
# -----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:petshop-dev-jwt-secret-change-me-min-32-bytes!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -----------------------------------------------------------------------------
# ?????? user_product_recommendation?
# ????? model_version?????????????rank ???
# -----------------------------------------------------------------------------
# ???????????xgb_hybrid_v1??????????
app.recommendation.offline-model-version=
# ??????????generated_at ??????? model_version ????????????
app.recommendation.use-latest-generated-batch=true

# -----------------------------------------------------------------------------
# ?????Python online_score_server.py?????????
# -----------------------------------------------------------------------------
# ??????????????????????????????
# ????????XGBOOST/run_online_score_server.ps1
app.recommendation.online-inference-enabled=true
app.recommendation.online-inference-base-url=http://127.0.0.1:8765

# ??/??????????????????? 1 ????????
app.recommendation.online-trigger-enabled=true
# 演示：最近 N 天内「合并连续同商品后的 view/click 步数」每满 10 即触发在线 XGB 重算；冷却设为 0 表示不等待间隔
app.recommendation.online-trigger-unique-view-threshold=10
app.recommendation.online-trigger-lookback-days=14
app.recommendation.online-trigger-cooldown-ms=0
app.recommendation.online-cache-ttl-ms=1800000

# 基于 review 表聚合（均分、条数）对推荐排序微调；达标商品 API 返回 commentStrongRecommend=true，前端可展示「评论强推」
app.recommendation.comment-boost-enabled=true
app.recommendation.comment-strong-min-avg=4.5
app.recommendation.comment-strong-min-count=3

# 智能导购「评论强推」：强制调用评论 BERT 服务（tools/review_bert_score_server.py，默认 8766），再与 XGB 分融合
app.recommendation.review-bert-inference-enabled=true
app.recommendation.review-bert-inference-base-url=http://127.0.0.1:8766
# 融合权重（会自动归一化）：XGB 在本批内的 min-max 归一化分、BERT 评论聚合分（约 0~1）
app.recommendation.ai-guide-fusion-xgb-weight=0.35
app.recommendation.ai-guide-fusion-bert-weight=0.65

# -----------------------------------------------------------------------------
# ???PowerShell ??????????? MySQL?
# -----------------------------------------------------------------------------
