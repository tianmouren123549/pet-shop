spring.application.name=petshop

# ????????? application-local.properties ???????????? .gitignore?
spring.config.import=optional:classpath:application-local.properties

# true ?????????? message ???????????? false
app.debug.api-error-detail=true

# -----------------------------------------------------------------------------
