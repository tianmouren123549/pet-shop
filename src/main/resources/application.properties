app.demo.refresh-recommendations-script=
app.demo.refresh-recommendations-on-startup=false
app.demo.refresh-recommendations-on-each-api-call=false
app.demo.refresh-recommendations-min-interval-ms=180000
app.demo.refresh-recommendations-scheduled-enabled=false
app.demo.refresh-recommendations-cron=0 0 3 * * *

